# Licence-policy and secrets checks. Technical policy only: a green run is not
# a legal sign-off (docs/legal/REDVAULT_AGPL_COMPLIANCE_REPORT.md).
#
# - policy:              must pass for development (AGPL texts, licence fields,
#                        libsignal pins, web/server boundaries, notices present).
# - release-eligibility: the same plus release gates (no unknown licences, no
#                        proprietary libraries in AGPL builds, public source URL).
#                        Informational on pushes; required on release tags.
# - secrets:             gitleaks over the full history, pinned by checksum.
name: Licence compliance
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Licence policy (development)
        run: python3 tools/compliance/check.py

  release-eligibility:
    runs-on: ubuntu-24.04
    # Legal review is still pending: report the gaps without blocking day-to-day
    # work, but block release tags.
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - name: Licence policy (release eligibility)
        env:
          REDVAULT_SOURCE_URL_FOR_CI: ${{ vars.REDVAULT_SOURCE_CODE_URL }}
        run: python3 tools/compliance/check.py --release

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history
        # Reviewed findings are listed, with reasons, in .gitleaksignore.
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner
