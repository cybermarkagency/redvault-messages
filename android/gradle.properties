org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend the app talks to. Must end with "/". Override per machine in
# ~/.gradle/gradle.properties, or on the command line with
# -PredvaultApiBase=http://10.0.2.2:3000/api/ to reach a local dev server
# from the emulator (plain http is only allowed in debug builds).
redvaultApiBase=https://www.redvaultsystems.com/redvaultmessages/api/
