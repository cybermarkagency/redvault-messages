org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend the app talks to: the service's onion address, reached only through the
# embedded Tor gateway (docs/tor-by-default.md). Must end with "/". A release build
# refuses any other address. For a debug build only, override it on the command line
# with -PredvaultApiBase=http://10.0.2.2:3000/api/ to reach a local dev server from
# the emulator (that debug build then has no Tor; plain http to it is debug-only).
redvaultApiBase=http://4cydjhdc3lmhg7l6ykjont7dms2alunglmnlznlmjjwkyc67m5h325yd.onion/redvaultmessages/api/

# The sealed backup route (docs/tor-sealed-fallback.md): the live gateway's current public key configuration,
# as `redvault-ohttp-gateway public` prints it (key 1). Public: it is pinned in every published app. A release
# build refuses to be built without it. Empty (-PredvaultSealedKeyConfig=) gives a test build with no backup route.
redvaultSealedKeyConfig=0100201520cdea87024f0f31d1a98e4410736ddb8005f104ebe8c27f213b433ead9f2a000400010003
# This version's source link (Settings > Open-Source Licenses and Source Code), AGPL-3.0-only. Each Android release
# needs the tag android-v<version> in the public repository before it is published (desktop uses desktop-v<version>).
redvaultSourceCodeUrl=https://github.com/cybermarkagency/redvault-messages/tree/android-v{version}
