[package]
name = "redvault-tor"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
license = "AGPL-3.0-only"
description = "Redvault's embedded Tor gateway (proof of concept): Arti behind a local, authenticated SOCKS5 port that only reaches the Redvault onion service, for Windows, Linux and Android."

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
# The C ABI (desktop C++ on Windows and Linux).
ffi = []
# The JNI binding (Android).
jni = ["dep:jni"]
# Test-only hook: GatewayConfig::test_blocked_network (simulates a censored/offline network).
test-hooks = []
# Test-only: host a throwaway onion service in front of a local port.
onion-host = ["arti-client/onion-service-service", "dep:tor-hsservice", "dep:tor-cell", "dep:tor-proto", "dep:safelog"]

[dependencies]
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "onion-service-client", "vanguards", "static-sqlite"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
tor-hsservice = { version = "=0.47.0", optional = true }
tor-cell = { version = "=0.47.0", optional = true }
tor-proto = { version = "=0.47.0", optional = true }
tor-hscrypto = "=0.47.0"
safelog = { version = "0.10", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
jni = { version = "0.21", optional = true, default-features = false }

[dev-dependencies]
# Only for tests/saturating_time_regression.rs (the patched copy, see [patch.crates-io]).
saturating-time = "=0.5.0"

[[bin]]
name = "rv-onion-host"
required-features = ["onion-host"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

# Tor's directory verification is far too slow unoptimized: optimize
# dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Upstream saturating-time 0.5.0 loops forever on Windows (see patches/saturating-time/PATCHED.md).
[patch.crates-io]
saturating-time = { path = "patches/saturating-time" }
